name: Find leads (nightly)

on:
  schedule:
    - cron: "0 18 * * *"   # 11:00 PM Karachi (18:00 UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many qualified leads (use 5 for a test)"
        required: false
        default: "100"

concurrency:
  group: find-leads
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Find leads
        run: python -m pipeline.find --limit "${{ github.event.inputs.limit || '100' }}"
