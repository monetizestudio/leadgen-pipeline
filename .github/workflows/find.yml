name: Find leads (nightly)

on:
  schedule:
    - cron: "23 16 * * *"   # 9:23 PM Karachi (off the busy :00 mark; GitHub often starts it late)
  workflow_dispatch:
    inputs:
      limit:
        description: "Test only: stop after about this many leads (blank = full run, 25/day x 2 days per region)"
        required: false
        default: ""

concurrency:
  group: find-leads
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
      PYTHONUNBUFFERED: "1"         # logs show up live and survive a cancelled run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest -q tests
      - name: Find leads
        run: python -m pipeline.find --limit "${{ github.event.inputs.limit || '0' }}"
